name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm --prefix backend ci
      - run: npm --prefix frontend ci
      - run: python -m pip install -r ai_worker/requirements.txt
      - run: npm --prefix backend test
      - run: node --test frontend/src/leadUtils.test.js
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build
      - run: python -m unittest discover -s ai_worker -p 'test_*.py' -v
      - run: node backend/tests/mongo.integration.js
        env:
          WORKER_PYTHON: python
